<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>
        body {
            display: flex;  
            justify-content: center; /* Centers container horizontally */
            align-items: center;     /* Centers container vertically doesn't work  */
        }
        #container {
            display: flex;
            flex-direction: column;
            border: 1px solid black;
            padding: 20px;
            margin: 20px;
            align-items: center;
            background-color: #f0f0f0;
        }
        #heading {
            color: blue;
            font-size: 24px;
        }
        #paragraph {
            color: green;
            font-size: 18px;
        }  
        input {
            margin: 10px 0;
            padding: 5px;
        } 
        button {
            margin: 5px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1 id="heading">DOM Manipulation</h1>
        <p id="paragraph">This is a paragraph.</p>
        <input type="text" id="inputField" placeholder="Type something..."></input>
        <button id="changeTextButton" onclick="changeText()">Change Text</button>
        <button id="changeColorButton" onclick="changeColor()">Change Color</button>
        <button id="addElementButton" onclick="addElement()">Add Element</button>
    </div>

    <script src="dom.js"></script>
    
</body>
</html>
